<!DOCTYPE html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Nodoubt Finance</title>

    <link rel="icon" href="css/assets/images/money.ico" type="image/x-icon" />
    <link rel="stylesheet" href="css/style.css" type="text/css" />
  </head>
  <body>
    <header>
      <div id="header_side_upper" class="header_side_common">
        <div class="header_upper">
          <h1 id="greet" class="greet">WELCOME</h1>
        </div>
      </div>
      <div id="header_lower" class="header_side_common">
        <button id="settings-button" class="settings-button" type="button" aria-label="Open settings" aria-haspopup="dialog" aria-controls="settings-dialog">
          <img src="css/assets/images/settings.png" alt="" />
        </button>
      </div>
    </header>

    <main>
      <section id="section2">
        <div class="content_background">
          <div class="heading">
            <h3>ADD TRANSACITONS</h3>
          </div>
          <form id="myForm">
            <div class="form_row">
              <input type="date" name="date" id="date" />
              <input
                type="text"
                name="description"
                placeholder="Descripion"
                maxlength="20"
                id="description"
              />
            </div>
            <div class="form_row">
              <select name="Category" id="cate">
                <option value="food">FOOD</option>
                <option value="clothes">CLOTHES</option>
                <option value="courses">COURSES</option>
                <option value="fees">FEES</option>
                <option value="salary">SALARY</option>
                <option value="others">OHTERS</option>
              </select>

              <select name="type" id="type">
                <option value="income">INCOME</option>
                <option value="expense">EXPENSE</option>
              </select>

              <input
                type="text"
                name="amount"
                id="amount"
                placeholder="&#8377; Amount"
                maxlength="6"
              />
            </div>
            <div class="form_row">
              <input type="submit" id="submit" placeholder="submit" />
            </div>
          </form>
        </div>
      </section>

      <section id="section1">
        <div class="content_background">
          <div class="section1_content heading" class="heading">
            <h3>RECENT TRANSACTIONS</h3>
          </div>
          <table id="recent_5" class="transactions">
            <tr id="table_row">
              <th>DESCRPTION</th>
              <th>CATEGORY</th>
              <th>AMOUNT</th>
            </tr>
            <tbody id="recent_5_data">
              <tr>
                <td></td>
                <td></td>
                <td></td>
              </tr>
            </tbody>
          </table>
        </div>
      </section>

      <section id="section4">
        <div class="content_background" id="summary_content">
          <div class="heading"><h3>SUMMARY BOARD</h3></div>

          <div id="section4_rows">
            <div class="section4_content" id="basic">
              <div class="head"><h4 id="summ_balance"></h4></div>
              <div class="head green"><h4 id="summ_income"></h4></div>
              <div class="head red"><h4 id="summ_expense"></h4></div>
            </div>
            <div class="section4_content">
              <div id="basic2">
                <div class="head"><h4 id="summ_budget"></h4></div>
                <div class="head red"><h4 id="summ_expensive"></h4></div>
              </div>
            </div>
            <div id="budget_add" class="section4_content">
              <input
                type="text"
                id="budget_input"
                name="budget"
                placeholder="&#8377; Enter Budget"
              />
              <button onclick="addBudget()">ADD</button>
            </div>
          </div>
        </div>
      </section>

      <section id="section3">
        <div class="content_background">
          <div class="heading">
            <h3>MONTHLY INCOME vs TOTAL EXPENSES</h3>
          </div>
          <div class="chart_background">
            <canvas id="myChart2"></canvas>
          </div>
        </div>
      </section>

      <section id="section5">
        <div class="content_background transaction_background">
          <div id="t_heading">
            <h3>ALL TRANSACTIONS</h3>
          </div>
          <div class="table_wrapper">
            <table id="all_transactions" class="transactions">
              <thead>
                <tr id="table_row">
                  <th>ID</th>
                  <th>Date</th>
                  <th>Description</th>
                  <th>Category</th>
                  <th>Type</th>
                  <th>Amount</th>
                  <th colspan="2">Actions</th>
                </tr>
              </thead>
              <tbody id="trac_rows">
                <!-- example data here -->
                <!-- <tr>
                  <td id="id">1</td>
                  <td id="delbydate">05-08-2005</td>
                  <td>burger</td>
                  <td>food</td>
                  <td class="type_inc_exp">income</td>
                  <td>200</td>
                  <td class="blue">EDIT</td>
                  <td class="delete" id="del" >DELETE</td>
                </tr> -->
              </tbody>
            </table>
          </div>
        </div>
      </section>

      <section id="section6">
        <div class="content_background">
          <h1>NO TRANSACITONS</h1>
        </div>
      </section>

      <section class="clear-all-section">
        <button class="clear-all-button" type="button" onclick="clearAll()">
          clear all
        </button>
      </section>
    </main>

    <dialog id="settings-dialog" class="settings-dialog" aria-labelledby="settings-title">
      <div class="settings-heading">
        <div>
          <p class="settings-eyebrow">PREFERENCES</p>
          <h2 id="settings-title">Settings</h2>
        </div>
        <button id="settings-close" class="settings-close" type="button" aria-label="Close settings">&times;</button>
      </div>
      <label class="theme-setting" for="theme-select">
        <span><strong>Appearance</strong><small>Choose the dashboard theme</small></span>
        <select id="theme-select" aria-label="Color theme">
          <option value="dark">Dark</option>
          <option value="light">Light</option>
        </select>
      </label>
      <div class="settings-actions">
        <div><strong>Your data</strong><small>Export a backup or clear your saved transactions.</small></div>
        <button id="download-csv" class="settings-action" type="button">Download data as CSV</button>
        <button id="reset-data" class="settings-action settings-danger" type="button">Reset all data</button>
      </div>
      <p id="settings-status" class="settings-status" role="status" aria-live="polite"></p>
    </dialog>

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="scripts/scripts.js"></script>
  </body>
</html>
