<!DOCTYPE html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#111827" />
    <title>Nodoubt Finance</title>

    <link rel="icon" href="css/assets/images/money.ico" type="image/x-icon" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;500;600;700&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <script>
      tailwind = window.tailwind || {};
      tailwind.config = {
        darkMode: ['selector', '[data-theme="dark"]'],
        theme: { extend: { fontFamily: { sans: ['Poppins', 'Noto Sans', 'sans-serif'] } } }
      };
    </script>
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Keep the project stylesheet as a local fallback if the Tailwind CDN is unavailable. -->
    <link rel="stylesheet" href="css/style.css" type="text/css" />
  </head>
  <body class="min-h-screen bg-gradient-to-b from-gray-700 to-gray-950 font-sans text-white dark:bg-gradient-to-b dark:from-gray-700 dark:to-gray-950">
    <header class="flex h-[100px] items-center justify-between bg-white px-5 shadow-md dark:bg-stone-800 md:px-8">
      <div class="flex h-full w-1/2 items-center"><h1 id="greet" class="text-xl font-bold text-amber-500 md:text-2xl">WELCOME</h1></div>
      <div class="flex h-full w-1/2 items-center justify-end">
        <button id="settings-button" class="group grid h-[52px] w-[52px] place-items-center rounded-full bg-transparent p-2 transition hover:bg-gray-100 focus-visible:outline focus-visible:outline-2 focus-visible:outline-blue-500 dark:hover:bg-white/10" type="button" aria-label="Open settings" aria-haspopup="dialog" aria-controls="settings-dialog">
          <img class="h-[35px] w-[35px] transition-transform duration-500 group-hover:rotate-180 group-focus-visible:rotate-180" src="css/assets/images/settings.png" alt="" />
        </button>
      </div>
    </header>

    <main class="mx-auto grid max-w-[1600px] grid-cols-1 gap-2.5 py-2.5 md:grid-cols-2">
      <section id="section2" class="flex h-[300px] w-full justify-center p-2.5">
        <div class="flex w-[95%] flex-col items-center rounded-xl border-2 border-white/10 bg-white text-gray-900 shadow-lg dark:border-stone-700 dark:bg-stone-800 dark:text-white">
          <div class="flex h-[15%] w-full items-center justify-center bg-gradient-to-r from-slate-200 to-slate-400 text-center dark:from-stone-900 dark:to-gray-600"><h3 class="font-semibold tracking-wide">ADD TRANSACTIONS</h3></div>
          <form id="myForm" class="flex h-[85%] w-full flex-col justify-around">
            <div class="flex h-1/5 w-full flex-row flex-wrap items-center justify-around gap-2 px-3">
              <input class="h-[90%] w-[40%] min-w-[130px] rounded-md border border-gray-300 bg-orange-200 p-2 text-sm text-gray-900 transition hover:bg-amber-200 focus:outline-none focus:ring-2 focus:ring-blue-500" type="date" name="date" id="date" required />
              <input class="h-[90%] w-[40%] min-w-[130px] rounded-md border border-gray-300 bg-orange-200 p-2 text-sm text-gray-900 transition placeholder:text-gray-700 hover:bg-amber-200 focus:outline-none focus:ring-2 focus:ring-blue-500" type="text" name="description" placeholder="Description" maxlength="20" id="description" required />
            </div>
            <div class="flex h-1/5 w-full flex-row flex-wrap items-center justify-around gap-2 px-3">
              <select class="h-[90%] min-w-[80px] rounded-md border border-gray-300 bg-orange-200 p-2 text-xs text-gray-900 hover:bg-amber-200 focus:outline-none focus:ring-2 focus:ring-blue-500" name="Category" id="cate"><option value="food">FOOD</option><option value="clothes">CLOTHES</option><option value="courses">COURSES</option><option value="fees">FEES</option><option value="salary">SALARY</option><option value="others">OTHERS</option></select>
              <select class="h-[90%] min-w-[90px] rounded-md border border-gray-300 bg-orange-200 p-2 text-xs text-gray-900 hover:bg-amber-200 focus:outline-none focus:ring-2 focus:ring-blue-500" name="type" id="type"><option value="income">INCOME</option><option value="expense">EXPENSE</option></select>
              <input class="h-[90%] w-[30%] min-w-[100px] rounded-md border border-gray-300 bg-orange-200 p-2 text-sm text-gray-900 placeholder:text-gray-700 hover:bg-amber-200 focus:outline-none focus:ring-2 focus:ring-blue-500" type="number" min="0.01" step="0.01" name="amount" id="amount" placeholder="₹ Amount" required />
            </div>
            <div class="flex h-1/5 items-center justify-center px-4"><input class="h-[75%] w-1/2 cursor-pointer rounded-md bg-blue-600 px-4 font-semibold text-white transition hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-blue-400" type="submit" id="submit" value="ADD TRANSACTION" /></div>
          </form>
        </div>
      </section>

      <section id="section1" class="flex h-[300px] w-full justify-center p-2.5">
        <div class="flex w-[95%] flex-col items-center overflow-hidden rounded-xl border-2 border-white/10 bg-white text-gray-900 shadow-lg dark:border-stone-700 dark:bg-stone-800 dark:text-white">
          <div class="flex h-[15%] w-full items-center justify-center bg-gradient-to-r from-slate-200 to-slate-400 dark:from-stone-900 dark:to-gray-600"><h3 class="font-semibold tracking-wide">RECENT TRANSACTIONS</h3></div>
          <div class="w-full flex-1 overflow-auto"><table id="recent_5" class="w-full border-collapse text-center text-sm [&_td]:h-10 [&_td]:border-b [&_td]:border-gray-200 [&_td]:px-2 dark:[&_td]:border-stone-700"><thead class="sticky top-0 bg-slate-100 text-xs font-semibold dark:bg-stone-900"><tr id="table_row"><th class="p-2">DESCRIPTION</th><th class="p-2">CATEGORY</th><th class="p-2">AMOUNT</th></tr></thead><tbody id="recent_5_data" class="divide-y divide-gray-200 dark:divide-stone-700"></tbody></table></div>
        </div>
      </section>

      <section id="section4" class="flex h-[300px] w-full justify-center p-2.5">
        <div id="summary_content" class="flex w-[95%] flex-col items-center rounded-xl border-2 border-white/10 bg-white text-gray-900 shadow-lg dark:border-stone-700 dark:bg-stone-800 dark:text-white">
          <div class="flex h-[15%] w-full items-center justify-center bg-gradient-to-r from-slate-200 to-slate-400 dark:from-stone-900 dark:to-gray-600"><h3 class="font-semibold tracking-wide">SUMMARY BOARD</h3></div>
          <div id="section4_rows" class="flex h-[85%] w-full flex-col items-center justify-around">
            <div id="basic" class="flex h-1/3 w-full flex-wrap items-center justify-around text-center"><div class="w-1/3 px-1 text-sm font-semibold sm:text-base"><h4 id="summ_balance"></h4></div><div class="w-1/3 px-1 text-sm font-semibold text-green-600 sm:text-base"><h4 id="summ_income"></h4></div><div class="w-1/3 px-1 text-sm font-semibold text-red-600 sm:text-base"><h4 id="summ_expense"></h4></div></div>
            <div class="flex h-1/3 w-full items-center justify-around text-center"><div class="w-1/2 px-1 text-sm font-semibold sm:text-base"><h4 id="summ_budget"></h4></div><div class="w-1/2 px-1 text-sm font-semibold text-red-600 sm:text-base"><h4 id="summ_expensive"></h4></div></div>
            <div id="budget_add" class="flex h-1/4 w-full items-center justify-around px-3"><input class="h-4/5 w-3/5 rounded-md bg-orange-200 px-3 text-sm text-gray-900 placeholder:text-gray-700 focus:outline-none focus:ring-2 focus:ring-blue-500" type="number" min="0.01" step="0.01" id="budget_input" name="budget" placeholder="₹ Enter Budget" /><button class="h-4/5 w-1/4 cursor-pointer rounded-md bg-orange-400 px-3 font-semibold text-gray-900 transition hover:bg-amber-300" type="button" onclick="addBudget()">ADD</button></div>
          </div>
        </div>
      </section>

      <section id="section3" class="flex h-[300px] w-full justify-center p-2.5">
        <div class="flex w-[95%] flex-col items-center rounded-xl border-2 border-white/10 bg-white text-gray-900 shadow-lg dark:border-stone-700 dark:bg-stone-800 dark:text-white"><div class="flex h-[15%] w-full items-center justify-center bg-gradient-to-r from-slate-200 to-slate-400 px-2 text-center dark:from-stone-900 dark:to-gray-600"><h3 class="text-sm font-semibold sm:text-base">MONTHLY INCOME VS TOTAL EXPENSES</h3></div><div class="flex h-[85%] w-[90%] min-w-[250px] items-center justify-center p-3"><canvas id="myChart2"></canvas></div></div>
      </section>

      <section id="section5" class="col-span-1 flex h-[500px] w-full justify-center p-2.5 md:col-span-2">
        <div class="transaction_background flex w-[95%] flex-col items-center overflow-hidden rounded-xl border-2 border-white/10 bg-white text-gray-900 shadow-lg dark:border-stone-700 dark:bg-stone-800 dark:text-white md:w-[97.5%]"><div id="t_heading" class="flex h-[15%] min-h-12 w-full items-center justify-center bg-gradient-to-r from-slate-200 to-slate-400 dark:from-stone-900 dark:to-gray-600"><h3 class="text-lg font-semibold md:text-xl">ALL TRANSACTIONS</h3></div><div class="table_wrapper h-full w-full overflow-auto"><table id="all_transactions" class="w-full border-collapse text-sm [&_th]:sticky [&_th]:top-0 [&_th]:z-10 [&_th]:border [&_th]:border-gray-300 [&_th]:bg-slate-100 [&_th]:p-2 [&_th]:text-center [&_th]:text-xs [&_td]:border [&_td]:border-gray-200 [&_td]:px-2 [&_td]:py-3 [&_td]:text-center [&_tr:nth-child(even)]:bg-slate-50 dark:[&_th]:border-stone-700 dark:[&_th]:bg-stone-900 dark:[&_td]:border-stone-700 dark:[&_tr:nth-child(even)]:bg-stone-900/50"><thead><tr id="table_row"><th>ID</th><th>Date</th><th>Description</th><th>Category</th><th>Type</th><th>Amount</th><th colspan="2">Actions</th></tr></thead><tbody id="trac_rows"></tbody></table></div></div>
      </section>

      <section id="section6" class="flex h-[300px] w-full justify-center p-2.5 md:col-span-2"><div class="flex w-[95%] items-center justify-center rounded-xl border-2 border-white/10 bg-white text-gray-900 shadow-lg dark:border-stone-700 dark:bg-stone-800 dark:text-white"><h1 class="text-2xl font-semibold">NO TRANSACTIONS</h1></div></section>
      <section class="col-span-1 flex h-auto justify-center p-3 md:col-span-2"><button class="w-auto cursor-pointer rounded-lg bg-red-600 px-6 py-3 font-semibold text-white transition hover:bg-red-700 focus:outline-none focus:ring-2 focus:ring-red-300" type="button" onclick="clearAll()">CLEAR ALL</button></section>
    </main>

    <dialog id="settings-dialog" class="m-auto max-h-[calc(100vh-32px)] w-[min(440px,calc(100%-32px))] rounded-2xl border border-gray-200 bg-white p-6 text-gray-900 shadow-2xl backdrop:bg-black/60 dark:border-stone-700 dark:bg-stone-800 dark:text-white" aria-labelledby="settings-title">
      <div class="flex items-center justify-between gap-4"><div><p class="mb-1 text-xs font-bold tracking-widest text-blue-700 dark:text-blue-300">PREFERENCES</p><h2 id="settings-title" class="text-2xl font-semibold">Settings</h2></div><button id="settings-close" class="grid h-9 w-9 place-items-center rounded-full text-2xl transition hover:bg-gray-100 focus:outline-none focus:ring-2 focus:ring-blue-500 dark:hover:bg-white/10" type="button" aria-label="Close settings">&times;</button></div>
      <label class="mt-6 flex items-center justify-between gap-4 border-y border-gray-200 py-4 dark:border-stone-700" for="theme-select"><span class="grid gap-1"><strong>Appearance</strong><small class="text-xs text-gray-500 dark:text-gray-300">Choose the dashboard theme</small></span><select id="theme-select" class="rounded-lg border border-gray-300 bg-white px-3 py-2 text-sm dark:border-stone-600 dark:bg-stone-900" aria-label="Color theme"><option value="dark">Dark</option><option value="light">Light</option></select></label>
      <div class="mt-5 grid gap-3"><div class="grid gap-1"><strong>Your data</strong><small class="text-xs text-gray-500 dark:text-gray-300">Export a backup or clear your saved transactions.</small></div><button id="download-csv" class="min-h-11 rounded-lg border border-gray-300 px-4 py-2 text-left text-sm transition hover:bg-gray-100 focus:outline-none focus:ring-2 focus:ring-blue-500 dark:border-stone-600 dark:hover:bg-white/10" type="button">Download data as CSV</button><button id="reset-data" class="min-h-11 rounded-lg border border-red-300 px-4 py-2 text-left text-sm text-red-700 transition hover:bg-red-50 focus:outline-none focus:ring-2 focus:ring-red-500 dark:border-red-900 dark:text-red-300 dark:hover:bg-red-950/40" type="button">Reset all data</button></div>
      <p id="settings-status" class="mt-3 min-h-[18px] text-xs text-green-700 dark:text-green-400" role="status" aria-live="polite"></p>
    </dialog>

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="scripts/scripts.js"></script>
  </body>
</html>
